services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-cg_foods_sentiment}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      # Persists the database across container restarts/rebuilds, so the
      # dataset only has to be built once.
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host-side port only (the `app` service always reaches this over
      # the internal Docker network at db:5432, unaffected by this).
      # Override if 5432 is already taken on your machine, e.g.
      # `POSTGRES_HOST_PORT=5433 docker compose up -d db`.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cg_foods_sentiment}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Where manual-export CSVs referenced by TWITTER_MANUAL_EXPORT_CSV /
      # FACEBOOK_MANUAL_EXPORT_CSV must live to be visible inside the
      # container, and where pipeline output files (report.pdf, the
      # classification/event-analysis JSON reports) land.
      - ./data:/app/data
    environment:
      # Populated by variable substitution from a host .env file (copy
      # .env.example to .env) if present -- all optional, same as running
      # without Docker. Compose reads that top-level .env automatically;
      # it's separate from the app's own python-dotenv loading.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-cg_foods_sentiment}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - YOUTUBE_RESOLVE_COMMENTER_REGION=${YOUTUBE_RESOLVE_COMMENTER_REGION:-false}
      - TWITTER_TRY_SNSCRAPE=${TWITTER_TRY_SNSCRAPE:-false}
      - TWITTER_MANUAL_EXPORT_CSV=${TWITTER_MANUAL_EXPORT_CSV:-}
      - FACEBOOK_MANUAL_EXPORT_CSV=${FACEBOOK_MANUAL_EXPORT_CSV:-}

volumes:
  pgdata:
